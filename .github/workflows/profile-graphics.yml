name: Refresh profile graphics

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-graphics.yml

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Sachin-Bhat
          outputs: |
            assets/contributions-light.svg?color_snake=#b78222&color_dots=#ebedf0,#c0eadc,#79d2b1,#36ac83,#167353
            assets/contributions-dark.svg?palette=github-dark&color_snake=#efbe65&color_dots=#161b22,#193f35,#21644e,#369d75,#71dfb3

      - name: Generate activity card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=Sachin-Bhat&show_icons=true&hide_rank=true&card_width=400&hide_border=true&bg_color=00000000&title_color=167353&icon_color=b78222&text_color=1f2328&custom_title=GitHub%20activity&disable_animations=false
          path: assets/stats-light.svg
          fail_on_error: true

      - name: Generate activity card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=Sachin-Bhat&show_icons=true&hide_rank=true&card_width=400&hide_border=true&bg_color=00000000&title_color=71dfb3&icon_color=efbe65&text_color=c9d1d9&custom_title=GitHub%20activity&disable_animations=false
          path: assets/stats-dark.svg
          fail_on_error: true

      - name: Generate language card (light)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=Sachin-Bhat&layout=compact&langs_count=8&card_width=400&hide_border=true&bg_color=00000000&title_color=167353&text_color=1f2328&custom_title=Languages%20in%20public%20repos&disable_animations=false
          path: assets/languages-light.svg
          fail_on_error: true

      - name: Generate language card (dark)
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=Sachin-Bhat&layout=compact&langs_count=8&card_width=400&hide_border=true&bg_color=00000000&title_color=71dfb3&text_color=c9d1d9&custom_title=Languages%20in%20public%20repos&disable_animations=false
          path: assets/languages-dark.svg
          fail_on_error: true

      - name: Normalize generated cards
        run: sed -i '/^[[:space:]]*$/d; s/[[:blank:]]*$//' assets/stats-*.svg assets/languages-*.svg

      - name: Commit refreshed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-*.svg assets/stats-*.svg assets/languages-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile activity graphics"
          git pull --rebase origin main
          git push origin HEAD:main
